name: atheer
description: "Atheer - A comprehensive Quran app for reading, listening, and memorization."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Dependency injection
  get_it: ^8.0.3

  # Audio
  just_audio: ^0.9.42

  # Notifications
  flutter_local_notifications: ^18.0.1

  # UI/UX
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Misc
  connectivity_plus: ^6.1.3
  shared_preferences: ^2.5.2
  dartz: ^0.10.1
  rxdart: ^0.28.0
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.3
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/quran/
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo.png"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
